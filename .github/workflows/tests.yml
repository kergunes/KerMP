name: tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest

  sims-python37-syntax:
    runs-on: ubuntu-latest
    container: python:3.7-slim
    steps:
      - uses: actions/checkout@v4
      - run: python --version
      - run: python -m compileall -q sims_mod_src/kermp_mod
